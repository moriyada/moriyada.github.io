<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>favorites - Moriyada</title>
  <link rel="preload" href="../fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/fraunces-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://uxjsqgeynszqhkzzwvhd.supabase.co" crossorigin>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="stylesheet" href="../css/style.css">
  <script defer src="../js/vendor/supabase-2.45.4.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"></script>
  <script defer src="../js/config.js"></script>
  <script defer src="../js/db.js"></script>
  <script defer src="../js/offline.js"></script>
  <script defer src="../js/render.js"></script>
  <script defer src="../js/lightbox.js"></script>
  <script defer src="../js/ribbon.js"></script>
  <script defer src="../js/compress.js"></script>
  <script defer src="../js/favorites.js"></script>
  <script defer src="../js/favorites-manage.js"></script>
  <script src="../js/theme.js"></script>
</head>
<body data-root="../" data-page="favorites">
<div id="page">

  <header id="top">
    <div id="top-right">
      <button id="theme-toggle" type="button" aria-label="switch theme"></button>
    </div>
    <h1><a href="../index.html">Moriyada</a></h1>
    <p class="subtitle">all-time favorites, and what they replaced</p>
  </header>

  <nav id="ribbon"></nav>

  <main id="content">
    <p class="note">loading...</p>
  </main>

  <section class="box" id="fav-manager" hidden>
    <h2>Manage favorites</h2>
    <p class="note">Only you see this box. Changing a favorite keeps the old one as "previously".</p>
    <div id="fav-status" class="notice" role="status" aria-live="polite" hidden></div>
    <form id="fav-form" class="form">
      <h3 id="fav-form-title" class="fav-form-title">Set a new favorite</h3>
      <div class="field">
        <label for="fav-cat">category</label>
        <select id="fav-cat"></select>
      </div>
      <div class="field">
        <label for="fav-name" id="fav-name-label">new favorite</label>
        <input type="text" id="fav-name" maxlength="200" autocomplete="off">
      </div>
      <div class="field">
        <label for="fav-why">why (one line, optional)</label>
        <input type="text" id="fav-why" maxlength="300" autocomplete="off">
      </div>
      <div class="field">
        <label for="fav-since">my favorite since</label>
        <input type="date" id="fav-since">
      </div>
      <div class="field" id="fav-until-field" hidden>
        <label for="fav-until">until (when it stopped being the favorite)</label>
        <input type="date" id="fav-until">
      </div>
      <div class="field">
        <label for="fav-photo">photo (optional)</label>
        <input type="file" id="fav-photo" accept="image/*">
        <div id="fav-photo-now" class="existing" hidden></div>
      </div>
      <p><button type="submit" id="fav-save">set favorite</button>
        <button type="button" id="fav-cancel" hidden>cancel edit</button>
        <span class="note" id="fav-hint">the current one moves to "previously"</span></p>
    </form>
    <div id="fav-list"><p class="note">loading...</p></div>
    <form id="fav-cat-form" class="form fav-cat-form">
      <div class="field">
        <label for="fav-new-cat">add a category</label>
        <input type="text" id="fav-new-cat" maxlength="60" autocomplete="off">
      </div>
      <p><button type="submit">add category</button></p>
    </form>
  </section>

  <footer><a href="post.html">post</a></footer>

</div>
</body>
</html>
