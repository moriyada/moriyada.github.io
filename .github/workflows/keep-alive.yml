# Keeps the free Supabase project from pausing (it pauses after 7 days without activity).
# Every 3 days it reads one row through the public API, using only the public URL and anon
# key that are already in js/config.js. No secrets, no third-party actions.
# If the ping fails (e.g. the project already paused), the run fails and GitHub emails you.
# Note: GitHub turns off scheduled workflows after about 60 days with no activity in the repo.
# That's fine: the site then keeps showing its last published archive (see pages.yml).
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *'   # days 1, 4, 7, ... of each month at 03:17 UTC (11:17 AM Manila)
  workflow_dispatch: {}      # lets you run it by hand: Actions > Keep Supabase awake > Run workflow

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase with the public anon key
        run: |
          set -eu
          CONFIG=$(curl -fsS --max-time 30 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/js/config.js")
          URL=$(printf '%s' "$CONFIG" | grep -oE 'https://[a-z0-9]+\.supabase\.co' | head -n 1)
          KEY=$(printf '%s' "$CONFIG" | grep -oE "eyJ[A-Za-z0-9_.-]+|sb_publishable_[A-Za-z0-9_-]+" | head -n 1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Couldn't find the Supabase URL/anon key in js/config.js"; exit 1; fi
          CODE=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            "$URL/rest/v1/entries?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered HTTP $CODE"
          test "$CODE" = "200"
