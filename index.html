<body data-root="" data-page="home">
<div id="page">

  <header id="top">
    <div id="top-right">
      <button id="theme-toggle" type="button" aria-label="switch theme"></button>
      <div id="day-counter">DAY ----</div>
    </div>
    <h1><a href="index.html">Moriyada</a></h1>
    <p class="subtitle">a public diary &amp; archive</p>
    <p class="meta">last updated: <span id="last-updated">loading...</span></p>

  <nav id="ribbon"></nav>

  <div id="notice" class="notice" hidden></div>

  <section id="qotd" class="box" hidden>
    <h2>Quote of the day</h2>
    <blockquote></blockquote>
    <p class="source note"></p>
  </section>

  <main id="today">
    <h2 class="section-head">Today &middot; <span id="today-label"></span></h2>
    <div id="bento"><p class="note">loading...</p></div>
  </main>

  <div id="below">
    <section id="now" class="box" hidden>
      <h2>Now</h2>
      <table><tbody></tbody></table>
    </section>
    <section id="otd" class="box">
      <h2>On this day</h2>
      <div id="otd-list"><p class="note">loading...</p></div>
    </section>
  </div>

  <div id="almanac">
    <section id="figure" class="box">
      <h2>Figure of the day</h2>
      <div id="figure-body"><p class="note">loading...</p></div>
    </section>
    <section id="history" class="box">
      <h2>This day in history</h2>
      <div id="history-body"><p class="note">loading...</p></div>
    </section>
  </div>

  <footer>
    <span id="visitor-line" hidden>visitors <span id="visitors" class="counter">------</span> &middot; </span>
    <a href="html/post.html">post</a>
