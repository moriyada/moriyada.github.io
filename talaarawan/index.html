<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-src https://challenges.cloudflare.com; object-src 'none'; worker-src 'none'; manifest-src 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Talaarawan - Moriyada</title>
  <meta name="description" content="Talaarawan: a diary for everyone, no names.">
  <link rel="preload" href="../fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/fraunces-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/fraunces-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://uxjsqgeynszqhkzzwvhd.supabase.co" crossorigin>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dayari.css">
  <script defer src="../js/vendor/supabase-2.45.4.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"></script>
  <script defer src="../js/config.js"></script>
  <script defer src="../js/db.js"></script>
  <script defer src="../js/render.js"></script>
  <script defer src="../js/ribbon.js"></script>
  <script defer src="../js/dayari.js"></script>
  <script defer src="../js/dayari-home.js"></script>
  <script src="../js/theme.js"></script>
</head>
<body class="dayari" data-root="../" data-page="talaarawan">
<div id="page">

  <header id="top">
    <div id="top-right">
      <button id="theme-toggle" type="button" aria-label="switch theme"></button>
    </div>
    <h1><a href="index.html">Talaarawan</a></h1>
    <p class="subtitle">a diary for everyone, no names</p>
  </header>

  <nav id="ribbon" aria-label="Moriyada"></nav>

  <main id="content">
    <section id="write" class="dy-page" aria-label="Write today's entry">
      <form id="write-form" novalidate>
        <div class="dy-page-head">
          <span id="write-date" class="dy-date"></span>
          <span class="dy-anon">anonymous</span>
        </div>
        <label class="visually-hidden" for="text">Your entry</label>
        <textarea id="text" name="text" maxlength="2000" aria-describedby="write-hint count" placeholder="Kumusta ang araw mo?"></textarea>

        <!-- shown once, before the first post -->
        <label id="gate" class="dy-check" hidden><input type="checkbox" id="gate-agree"> <span>I'm 20 or older and I accept the <a href="rules.html">rules</a> and <a href="privacy.html">privacy</a>.</span></label>

        <div class="dy-page-foot">
          <span id="write-hint" class="hint">no names, numbers or addresses</span>
          <span id="count" class="dy-count" aria-live="polite">0 / 2,000</span>
          <button type="submit" id="post-button" class="primary">Post</button>
        </div>
        <div id="captcha-box" class="dy-captcha"></div>
        <div id="write-msg" class="dy-msg" role="status" aria-live="polite"></div>
        <div id="care"></div>
      </form>
    </section>

    <section id="mine" hidden aria-labelledby="mine-title">
      <h2 id="mine-title">Your pages</h2>
      <p class="hint">Only you see this list, on this browser.</p>
      <ul id="mine-list" class="dy-posts"></ul>
    </section>

    <section id="feed" aria-labelledby="feed-title">
      <h2 id="feed-title">Latest pages</h2>
      <ul id="feed-list" class="dy-posts dy-wall" aria-busy="true"><li class="dy-empty">loading...</li></ul>
      <div class="actions"><button type="button" id="more" class="quiet" hidden>Older pages</button></div>
    </section>
  </main>

  <footer>
    <a href="rules.html">rules</a>
    <a href="privacy.html">privacy</a>
  </footer>

</div>
</body>
</html>
